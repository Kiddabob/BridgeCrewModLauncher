name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        shell: pwsh
        run: |
          ./Build.ps1
          ./Test.ps1
      - name: Package Windows x64
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected vMAJOR.MINOR.PATCH tag' }
          $version = $Matches[1]
          ./Package.ps1 -Version $version -OutputDirectory (Join-Path $PWD 'releases/public')
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem 'releases/public' -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Bridge Crew Mod Launcher $env:RELEASE_TAG" --notes-file docs/release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
